plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.suhasisnice.pinchcapture'
version = '0.2.0'

// SDK levels, Kotlin and Java targets come from expo-module-gradle-plugin,
// so this module always builds against whatever the app itself targets.
android {
  namespace 'com.suhasisnice.pinchcapture'
  defaultConfig {
    versionCode 2
    versionName '0.2.0'
    // Applied to the app's R8 pass too, so release minification keeps them.
    consumerProguardFiles 'proguard-rules.pro'
  }
}
